<!DOCTYPE html>
<html lang="am">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Siket Lotto | ስኬት ሎቶ</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        :root { --orange: #ff6b35; --gold: #fbbf24; --blue: #1d4ed8; --green: #15803d; --bg: #050a14; }
        body { font-family: sans-serif; margin: 0; padding: 0; color: white; background: var(--bg); display: flex; flex-direction: column; min-height: 100vh; }

        /* HEADER */
        header { background: #000; padding: 12px 15px; border-bottom: 2px solid var(--orange); display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 100; }
        .nav-title { font-size: 14px; font-weight: bold; margin: 0; }
        .lang-btn { background: none; border: 1px solid var(--orange); color: white; padding: 5px 10px; border-radius: 5px; font-size: 10px; cursor: pointer; }

        /* SECTION 1: HERO (Visible background.png) */
        .hero { width: 100%; background: #000; line-height: 0; }
        .hero img { width: 100%; height: auto; object-fit: contain; }

        /* SECTION 2: THE 3 TICKET BLOCKS (1.5 Ratio) */
        .comp-section { background: #0f172a; padding: 25px 15px; text-align: center; }
        .comp-title { font-size: 18px; color: var(--gold); margin-bottom: 20px; font-weight: bold; }
        .comp-grid { display: flex; flex-direction: column; gap: 25px; align-items: center; }
        
        .ticket-card { 
            width: 95%; max-width: 340px; aspect-ratio: 1.5 / 1; 
            background: #000; border-radius: 15px; overflow: hidden; 
            border: 1px solid rgba(255,255,255,0.1); position: relative;
        }
        .ticket-card img { width: 100%; height: 100%; object-fit: fill; }
        .buy-btn { 
            position: absolute; bottom: 12px; right: 12px;
            background: var(--orange); color: white; border: none; 
            padding: 10px 20px; border-radius: 8px; font-weight: bold; font-size: 14px; cursor: pointer;
        }

        /* SECTION 3: WINNERS TICKER */
        .ticker-wrap { background: rgba(255,255,255,0.03); margin: 20px 15px; padding: 15px; border-radius: 12px; border: 1px solid #1e293b; }
        .ticker-row { display: flex; justify-content: space-between; font-size: 11px; padding: 8px 0; border-bottom: 1px solid #1e293b; color: #94a3b8; }

        /* GRID VIEW (Hidden until click) */
        #grid-view { display: none; padding: 20px; text-align: center; flex: 1; }
        .grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; padding-top: 20px; }
        .cell { padding: 15px 0; border-radius: 8px; font-weight: bold; text-align: center; border: 1px solid rgba(255,255,255,0.1); }
        .available { background: var(--blue); }
        .pending { background: var(--yellow); color: #000; animation: pulse 1s infinite; }
        .sold { background: var(--green); opacity: 0.8; }

        /* FOOTER */
        footer { padding: 30px 20px; background: #000; border-top: 1px solid #334155; margin-top: auto; text-align: left; }
        .f-text { font-size: 11px; color: #64748b; line-height: 1.6; }

        #pay-modal { display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.98); z-index:200; align-items: center; justify-content: center; }
        .modal-box { background: #1e293b; padding: 25px; border-radius: 20px; width: 85%; border: 1px solid var(--orange); text-align: center; }
        @keyframes pulse { 50% { opacity: 0.5; } }
    </style>
</head>
<body>

    <header>
        <div class="header-left">
            <img src="images/logo.png" alt="S" height="28">
            <h1 class="nav-title" id="nav-title">ስኬት ሎቶ | Siket Lotto</h1>
        </div>
        <button class="lang-btn" onclick="toggleLang()" id="l-btn">English</button>
    </header>

    <main id="main-content">
        <!-- HOME VIEW -->
        <div id="home-view">
            <section class="hero"><img src="images/background.png" alt="Hero Banner"></section>
            
            <section class="comp-section">
                <div class="comp-title" id="sec-title">አሸናፊ የሚያደረጉዋችሁ እጣዎች</div>
                <div class="comp-grid">
                    <div class="ticket-card"><img src="images/golden.png" alt="Gold"><button class="buy-btn" onclick="openTier(3)">Buy Gold</button></div>
                    <div class="ticket-card"><img src="images/silver.png" alt="Silver"><button class="buy-btn" onclick="openTier(2)">Buy Silver</button></div>
                    <div class="ticket-card"><img src="images/bronze.png" alt="Bronze"><button class="buy-btn" onclick="openTier(1)">Buy Bronze</button></div>
                </div>
            </section>

            <!-- WINNERS TICKER -->
            <div class="ticker-wrap">
                <div style="font-size:12px; color:var(--gold); font-weight:bold; margin-bottom:10px;">Recent Winners</div>
                <div class="ticker-row"><span>Round #0044</span> <span>Ticket #07</span> <span>Yohannes T.</span></div>
                <div class="ticker-row"><span>Round #0043</span> <span>Ticket #82</span> <span>Sara M.</span></div>
            </div>
        </div>

        <!-- GRID VIEW -->
        <div id="grid-view">
            <button onclick="showHome()" style="color:var(--orange); background:none; border:none; font-weight:bold; cursor:pointer;">← Back</button>
            <div id="grid-header" style="background:rgba(255,255,255,0.05); padding:15px; border-radius:12px; margin-top:15px; border:1px solid var(--gold);">
                <h2 id="tier-name" style="margin:0; color:var(--gold)"></h2>
                <div id="prize-list" style="font-size:12px; margin-top:10px;"></div>
            </div>
            <div class="grid" id="main-grid"></div>
        </div>
    </main>

    <footer>
        <div id="f-t" style="font-weight:bold; color:white; margin-bottom:10px;">መግለጫ (Disclaimer)</div>
        <div class="f-text" id="f-b">የስኬት ሎተሪ አባላት ዕድሜያቸው 18+ መሆን አለበት። ተሳታፊዎች በኢትዮጵያ ነዋሪ መሆን አለባቸው። ክፍያ አንዴ ከተፈጸመ አይመለስም። ዕጣው በዘፈቀደ (Randomly) የሚወጣ ይሆናል።</div>
    </footer>

    <!-- Payment Modal -->
    <div id="pay-modal">
        <div class="modal-box">
            <h2 style="color:var(--orange); margin:0;">Payment / ክፍያ</h2>
            <p>Phone: <b>0998815949</b></p>
            <input type="text" id="phone" placeholder="የከፈሉበት ስልክ ቁጥር" style="width:100%; padding:10px; margin:10px 0; background:#000; border:1px solid #444; color:white; border-radius:5px;">
            <input type="file" id="photo" accept="image/*">
            <button onclick="submitP()" class="buy-btn" style="position:static; width:100%; margin-top:20px; padding:15px;">Submit</button>
            <button onclick="closeModal()" style="background:none; border:none; color:grey; margin-top:15px;">Cancel</button>
        </div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();
        let cTier = 3, lang = 'am', selN = null;

        async function openTier(id) {
            cTier = id;
            document.getElementById('home-view').style.display = 'none';
            document.getElementById('grid-view').style.display = 'block';
            load();
        }

        function showHome() { document.getElementById('home-view').style.display = 'block'; document.getElementById('grid-view').style.display = 'none'; }

        async function load() {
            const res = await fetch(`/api/status/${cTier}`);
            const data = await res.json();
            document.getElementById('tier-name').innerText = lang === 'am' ? data.prizes.name_am : data.prizes.name_en;
            document.getElementById('prize-list').innerText = `1st: ${data.prizes.p1_prize} ETB | 2nd: ${data.prizes.p2_prize} ETB | 3rd: ${data.prizes.p3_prize}`;
            const g = document.getElementById('main-grid');
            g.innerHTML = '';
            data.tickets.forEach(t => {
                const d = document.createElement('div');
                d.className = `cell ${t.status}`;
                d.innerText = t.number_val;
                d.onclick = () => { if(t.status==='available') { selN=t.number_val; document.getElementById('pay-modal').style.display='flex'; } };
                g.appendChild(d);
            });
        }
        function closeModal() { document.getElementById('pay-modal').style.display = 'none'; }
        async function submitP() { /* Reuse existing fetch logic */ }
        function toggleLang() { /* Reuse lang swap logic */ }
    </script>
</body>
</html>
