<!DOCTYPE html>
<html lang="am">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Siket Lotto | ስኬት ሎቶ</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        :root { 
            --orange: #ff6b35; --gold: #fbbf24; --blue: #1d4ed8; 
            --green: #15803d; --yellow: #eab308; --bg-dark: #050a14;
            --blue-black: #0f172a;
        }

        html, body { height: 100%; margin: 0; padding: 0; }
        body { 
            font-family: sans-serif; color: white; background: var(--bg-dark);
            display: flex; flex-direction: column; overflow-x: hidden;
        }

        header { 
            background: #000; padding: 12px 15px; border-bottom: 2px solid var(--orange); 
            display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 100; 
        }
        .header-left { display: flex; align-items: center; gap: 8px; }
        .logo-img { height: 28px; width: auto; }
        .nav-title { font-size: 13px; margin: 0; font-weight: bold; }
        .round-tag { font-size: 10px; color: var(--gold); margin-left: 5px; }
        .nav-right { display: flex; gap: 8px; align-items: center; }
        .lang-btn { background: none; border: 1px solid var(--orange); color: white; padding: 4px 8px; border-radius: 5px; font-size: 10px; cursor: pointer; }
        .contact-btn { color: white; text-decoration: none; font-size: 10px; font-weight: bold; border-left: 1px solid #334155; padding-left: 8px; }

        .hero { width: 100%; background: #000; line-height: 0; }
        .hero-banner { width: 100%; height: auto; object-fit: contain; }

        .comp-section { background: var(--blue-black); padding: 30px 15px; text-align: center; }
        .comp-title { font-size: 18px; font-weight: 800; margin-bottom: 20px; color: var(--gold); }
        .comp-grid { display: flex; flex-direction: column; gap: 20px; align-items: center; }
        
        .ticket-card { 
            width: 90%; max-width: 320px; aspect-ratio: 1.5 / 1; 
            background: #000; border-radius: 12px; overflow: hidden; 
            border: 1px solid rgba(255,255,255,0.1); position: relative;
        }
        .card-img { width: 100%; height: 100%; object-fit: fill; }
        .buy-overlay { position: absolute; bottom: 10px; right: 10px; }
        .buy-btn { background: var(--orange); color: white; border: none; padding: 8px 15px; border-radius: 5px; font-weight: bold; cursor: pointer; }

        /* COMING SOON SECTION */
        .coming-soon { 
            background: rgba(255, 255, 255, 0.03); 
            padding: 40px 20px; text-align: center; border-top: 1px solid #1e293b;
        }
        .cs-title { color: var(--orange); font-size: 18px; font-weight: bold; margin-bottom: 10px; }
        .cs-text { color: #94a3b8; font-size: 13px; line-height: 1.6; max-width: 80%; margin: 0 auto; }

        #grid-view { display: none; padding: 20px; text-align: center; }
        .grid-back { color: var(--orange); background: none; border: none; font-weight: bold; margin-bottom: 15px; cursor: pointer; }
        .prize-container { background: rgba(0,0,0,0.6); margin: 0 15px 15px 15px; padding: 15px; border-radius: 12px; border: 1px solid var(--gold); text-align: center; }
        .prize-title { margin: 0; color: var(--gold); font-size: 22px; font-weight: bold; }
        .prize-sub { font-size: 13px; margin-top: 8px; color: #cbd5e1; }

        .grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; padding: 10px; }
        .cell { padding: 15px 0; border-radius: 8px; font-weight: bold; text-align: center; border: 1px solid rgba(255,255,255,0.1); font-size: 16px; cursor: pointer; }
        .available { background: var(--blue); }
        .pending { background: var(--yellow); color: #000; animation: pulse 1s infinite; }
        .sold { background: var(--green); opacity: 0.8; pointer-events: none; }

        footer { padding: 30px 20px; background: #000; border-top: 1px solid #334155; text-align: left; margin-top: auto; }
        .footer-head { font-size: 14px; font-weight: bold; color: white; margin-bottom: 8px; }
        .footer-body { font-size: 11px; color: #64748b; line-height: 1.6; }

        #pay-modal { display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.98); z-index:200; align-items: center; justify-content: center; }
        .modal-box { background: #1e293b; padding: 25px; border-radius: 20px; width: 85%; border: 1px solid var(--orange); text-align: center; }
        .phone-input { width: 100%; padding: 12px; margin: 10px 0; border-radius: 8px; border: 1px solid #334155; background: #050a14; color: white; box-sizing: border-box; }
        .copy-tag { background: var(--orange); padding: 4px 8px; border-radius: 4px; font-size: 11px; cursor: pointer; color: white; font-weight: bold; display: inline-block; }

        #draw-overlay { display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.98); z-index:300; flex-direction:column; align-items:center; justify-content:center; }
        @keyframes pulse { 50% { opacity: 0.5; } }
    </style>
</head>
<body>

    <header>
        <div class="header-left">
            <img src="images/logo.png" alt="Siket Logo" class="logo-img">
            <h1 class="nav-title">ስኬት ሎቶ<span id="round-tag" class="round-tag">Round #0001</span></h1>
        </div>
        <div class="nav-right">
            <button class="lang-btn" onclick="toggleLang()" id="l-btn">English</button>
            <a href="https://t.me/Contact_Siketlottery" class="contact-btn">ያግኙን</a>
        </div>
    </header>

    <main>
        <div id="home-view">
            <section class="hero">
                <img src="images/background.png" alt="Siket Banner" class="hero-banner">
            </section>

            <section class="comp-section">
                <h2 class="comp-title" id="sec-t">አሸናፊ የሚያደረጉዋችሁ እጣዎች</h2>
                <div class="comp-grid">
                    <div class="ticket-card" onclick="openTier(3)">
                        <img src="images/golden.png" alt="Gold" class="card-img">
                        <div class="buy-overlay"><button class="buy-btn">Buy Gold</button></div>
                    </div>
                    <div class="ticket-card" onclick="openTier(2)">
                        <img src="images/silver.png" alt="Silver" class="card-img">
                        <div class="buy-overlay"><button class="buy-btn">Buy Silver</button></div>
                    </div>
                    <div class="ticket-card" onclick="openTier(1)">
                        <img src="images/bronze.png" alt="Bronze" class="card-img">
                        <div class="buy-overlay"><button class="buy-btn">Buy Bronze</button></div>
                    </div>
                </div>
            </section>

            <!-- NEW COMING SOON SECTION -->
            <section class="coming-soon">
                <div class="cs-title" id="cs-t">በቅርቡ ይጠብቁ!</div>
                <div class="cs-text" id="cs-b">አዳዲስ አስደሳች የሎተሪ ዕጣዎችን እና ታላላቅ ሽልማቶችን ይዘን እንመጣለን። ይከታተሉን!</div>
            </section>
        </div>

        <div id="grid-view">
            <button class="grid-back" onclick="showHome()">← ተመለስ (Back)</button>
            <div class="prize-container">
                <h2 id="grid-header" class="prize-title"></h2>
                <div id="prizes-list" class="prize-sub"></div>
            </div>
            <div class="grid" id="main-grid"></div>
        </div>
    </main>

    <footer>
        <div class="footer-head" id="f-t">መግለጫ (Disclaimer)</div>
        <div class="footer-body" id="f-b">የስኬት ሎተሪ አባላት ዕድሜያቸው 18+ መሆን አለበት። ተሳታፊዎች በኢትዮጵያ ነዋሪ መሆን አለባቸው። ክፍያ አንዴ ከተፈጸመ አይመለስም። ዕጣው በዘፈቀደ የሚወጣ ይሆናል።</div>
    </footer>

    <!-- Modal and Overlay code remains same -->
    <div id="pay-modal">
        <div class="modal-box">
            <div id="timer" style="color:red; font-size:24px; font-weight:bold; margin-bottom:10px;">07:00</div>
            <p>Pay to CBE / Telebirr: <br> <b>0998815949</b> <span class="copy-tag" onclick="copyN()">Copy</span></p>
            <input type="text" id="phone" class="phone-input" placeholder="የከፈሉበት ስልክ ቁጥር">
            <input type="file" id="photo" accept="image/*">
            <button onclick="sendPayment()" class="buy-btn" style="width:100%; margin-top:20px; padding:15px;">Submit Verification</button>
            <button onclick="closeModal()" style="background:none; color:grey; border:none; margin-top:15px; cursor:pointer;">Cancel</button>
        </div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();
        let cTier = 3, lang = 'am', selN = null, curRound = "0001";

        const langData = {
            am: {
                navT: "ስኬት ሎቶ | Siket Lotto", navC: "ያግኙን", 
                secT: "አሸናፊ የሚያደረጉዋችሁ እጣዎች", fT: "መግለጫ (Disclaimer)", 
                fB: "የስኬት ሎተሪ አባላት ዕድሜያቸው 18+ መሆን አለበት።",
                csT: "በቅርቡ ይጠብቁ!", csB: "አዳዲስ አስደሳች የሎተሪ ዕጣዎችን እና ታላላቅ ሽልማቶችን ይዘን እንመጣለን። ይከታተሉን!"
            },
            en: {
                navT: "Siket Lotto", navC: "Contact", 
                secT: "Hottest Competitions", fT: "Disclaimer", 
                fB: "Siket Lottery members must be 18+ years old.",
                csT: "Coming Soon!", csB: "We are preparing exciting new lotteries and even bigger prizes. Stay tuned!"
            }
        };

        function toggleLang() {
            lang = lang === 'am' ? 'en' : 'am';
            const d = langData[lang];
            document.getElementById('nav-title').innerHTML = `ስኬት ሎቶ<span id="round-tag" class="round-tag">Round #${curRound}</span>`;
            document.getElementById('l-btn').innerText = lang === 'am' ? 'English' : 'አማርኛ';
            document.getElementById('sec-t').innerText = d.secT;
            document.getElementById('f-t').innerText = d.fT;
            document.getElementById('f-b').innerText = d.fB;
            document.getElementById('cs-t').innerText = d.csT;
            document.getElementById('cs-b').innerText = d.csB;
        }

        async function openTier(id) {
            cTier = id;
            document.getElementById('home-view').style.display = 'none';
            document.getElementById('grid-view').style.display = 'block';
            load();
        }

        function showHome() { 
            document.getElementById('home-view').style.display = 'block'; 
            document.getElementById('grid-view').style.display = 'none'; 
        }

        async function load() {
            const res = await fetch(`/api/status/${cTier}`);
            const data = await res.json();
            curRound = String(data.round).padStart(4, '0');
            document.getElementById('round-tag').innerText = `Round #${curRound}`;
            document.getElementById('grid-header').innerText = lang === 'am' ? data.prizes.name_am : data.prizes.name_en;
            document.getElementById('prizes-list').innerText = `1st: ${data.prizes.p1_prize} ETB | 2nd: ${data.prizes.p2_prize} ETB | 3rd: ${data.prizes.p3_prize}`;
            const g = document.getElementById('main-grid');
            g.innerHTML = '';
            data.tickets.forEach(t => {
                const d = document.createElement('div');
                d.className = `cell ${t.status}`;
                d.innerText = t.number_val;
                d.onclick = () => { if(t.status==='available') { selN=t.number_val; document.getElementById('pay-modal').style.display='flex'; } };
                g.appendChild(d);
            });
        }
        
        function copyN() { navigator.clipboard.writeText("0998815949"); tg.showAlert("Copied!"); }
        function closeModal() { document.getElementById('pay-modal').style.display = 'none'; }
        async function sendPayment() {
            const ph = document.getElementById('phone').value;
            const file = document.getElementById('photo').files[0];
            if(!ph || !file) return tg.showAlert("Fill all fields");
            const fd = new FormData();
            fd.append('photo', file); fd.append('userId', tg.initDataUnsafe.user.id);
            fd.append('tierId', cTier); fd.append('number', selN); fd.append('phone', ph); fd.append('round', curRound);
            const res = await fetch('/api/upload-payment', { method: 'POST', body: fd });
            if(res.ok) { tg.showAlert("Sent!"); closeModal(); load(); }
        }
    </script>
</body>
</html>
