    <!DOCTYPE html>
<html lang="am">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Draw Countdown | የዕጣ ቆይታ</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Noto+Sans+Ethiopic:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-primary: #0B0E14;
            --accent: #D4AF37;
            --text-primary: #FFFFFF;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Inter', 'Noto Sans Ethiopic', sans-serif;
            background-image: url('images/countdown.png');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 0;
            animation: countdown-bg-pan 22s ease-in-out infinite alternate;
        }
        .container {
            text-align: center;
            max-width: 500px;
            width: 100%;
        }
        .tier-badge {
            font-size: 24px;
            font-weight: 900;
            color: #000000;
            margin-bottom: 20px;
        }
        .countdown-display {
            font-size: 72px;
            font-weight: 900;
            color: #000000;
            font-family: 'Courier New', monospace;
            margin: 30px 0;
            text-shadow: 0 0 20px rgba(15, 23, 42, 0.4);
            letter-spacing: 4px;
            animation: countdown-breathe 1.4s ease-in-out infinite;
        }
        .countdown-display.warning {
            color: #f97316;
            text-shadow: 0 0 24px rgba(249, 115, 22, 0.9);
            animation: countdown-warning 0.7s ease-in-out infinite;
        }
        .countdown-display.urgent {
            color: #ef4444;
            text-shadow: 0 0 26px rgba(239, 68, 68, 1);
            animation: countdown-urgent 0.35s ease-in-out infinite;
        }
        .status-text {
            font-size: 18px;
            color: #000000;
            margin-bottom: 30px;
        }
        .seed-info {
            background: rgba(0, 0, 0, 0.3);
            border-radius: 12px;
            padding: 20px;
            margin-top: 30px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        .seed-label {
            font-size: 12px;
            color: #94a3b8;
            margin-bottom: 8px;
            text-transform: uppercase;
        }
        .seed-hash {
            font-size: 11px;
            font-family: 'Courier New', monospace;
            color: var(--accent);
            word-break: break-all;
        }
        .safe-draw-badge {
            display: inline-block;
            margin: 16px 0;
            padding: 12px 24px;
            background: linear-gradient(135deg, rgba(212, 175, 55, 0.35), rgba(255, 122, 47, 0.25));
            border: 2px solid rgba(255, 211, 106, 0.8);
            border-radius: 999px;
            font-size: 14px;
            font-weight: 800;
            color: #FFD36A;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            animation: safe-draw-pulse 1.5s ease-in-out infinite;
            box-shadow: 0 0 24px rgba(255, 211, 106, 0.3);
        }
        @keyframes safe-draw-pulse {
            0%, 100% { transform: scale(1); box-shadow: 0 0 24px rgba(255, 211, 106, 0.3); opacity: 1; }
            50% { transform: scale(1.04); box-shadow: 0 0 32px rgba(255, 211, 106, 0.5); opacity: 0.95; }
        }
        .back-btn {
            position: fixed;
            top: 20px;
            left: 20px;
            background: rgba(0, 0, 0, 0.7);
            border: 1px solid rgba(255, 255, 255, 0.3);
            color: var(--accent);
            padding: 10px 20px;
            border-radius: 25px;
            text-decoration: none;
            font-weight: bold;
        }
        @keyframes countdown-bg-pan {
            0% { background-position: center top; }
            100% { background-position: center bottom; }
        }
        @keyframes countdown-breathe {
            0% { transform: scale(1); opacity: 0.9; }
            50% { transform: scale(1.05); opacity: 1; }
            100% { transform: scale(1); opacity: 0.95; }
        }
        @keyframes countdown-warning {
            0% { transform: scale(1); }
            50% { transform: scale(1.08); }
            100% { transform: scale(1); }
        }
        @keyframes countdown-urgent {
            0% { transform: scale(1); }
            50% { transform: scale(1.12); }
            100% { transform: scale(1); }
        }
    </style>
</head>
<body>
    <a href="index.html" class="back-btn">← Back</a>
    
    <div class="container">
        <div class="tier-badge" id="tier-name">Loading...</div>
        <div class="safe-draw-badge">Safe Draw / በልዩነት የተጠበቀ እጣ</div>
        <div class="countdown-display" id="countdown">03:00</div>
        <div class="status-text lang-en" id="status-en">Preparing for draw...</div>
        <div class="status-text lang-am" id="status-am">ዕጣውን ለመውጣት እየተዘጋጀ ነው...</div>
        
        <div class="seed-info" id="seed-info" style="display: none;">
            <div class="seed-label lang-en">Server Seed Hash (Published Before Draw)</div>
            <div class="seed-label lang-am">የሰርቨር ዘርድ ሃሽ (ከዕጣው በፊት የተሰራጨ)</div>
            <div class="seed-hash" id="seed-hash"></div>
        </div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();
        
        const urlParams = new URLSearchParams(window.location.search);
        const tierId = urlParams.get('tier') || '1';
        const tierNames = { '1': '🥉 BRONZE', '2': '🥈 SILVER', '3': '🥇 GOLD' };
        const tierNamesAm = { '1': '🥉 ነሐስ', '2': '🥈 ብር', '3': '🥇 ወርቅ' };
        
        document.getElementById('tier-name').textContent = tierNames[tierId] || 'UNKNOWN';
        
        let countdownInterval = null;
        let targetTime = null;
        
        async function updateCountdown() {
            try {
                const res = await fetch(`/api/countdown/${tierId}`);
                const data = await res.json();
                
                if (!data.isFull) {
                    const countdownEl = document.getElementById('countdown');
                    countdownEl.textContent = `${data.sold}/100`;
                    countdownEl.classList.remove('warning', 'urgent');
                    document.getElementById('status-en').textContent = `Waiting for all tickets to sell...`;
                    document.getElementById('status-am').textContent = `ሁሉም ትኬቶች እንዲሸጡ በመጠባበቅ ላይ...`;
                    return;
                }
                
                if (data.countdownStart) {
                    targetTime = new Date(data.countdownStart).getTime() + (180 * 1000); // 3 minutes (180s)
                }
                if (data.seedHash) {
                    document.getElementById('seed-info').style.display = 'block';
                    document.getElementById('seed-hash').textContent = data.seedHash;
                }
                
                if (targetTime) {
                    const now = Date.now();
                    const diff = targetTime - now;
                    
                    if (diff <= 0) {
                        window.location.href = `draw.html?tier=${tierId}`;
                        return;
                    }
                    
                    const totalSeconds = Math.floor(diff / 1000);
                    const minutes = Math.floor(diff / 60000);
                    const seconds = Math.floor((diff % 60000) / 1000);
                    const countdownEl = document.getElementById('countdown');
                    countdownEl.textContent = 
                        `${String(minutes).padStart(2, '0')}:${String(seconds).padStart(2, '0')}`;
                    countdownEl.classList.remove('warning', 'urgent');
                    
                    if (totalSeconds <= 10) {
                        countdownEl.classList.add('urgent');
                        document.getElementById('status-en').textContent = `Final seconds before draw...`;
                        document.getElementById('status-am').textContent = `ከዕጣው በፊት የመጨረሻ ሰከንዶች...`;
                    } else if (totalSeconds <= 60) {
                        countdownEl.classList.add('warning');
                        document.getElementById('status-en').textContent = `Almost time for the draw...`;
                        document.getElementById('status-am').textContent = `ለዕጣው ጊዜው ተቃርቧል...`;
                    } else {
                        document.getElementById('status-en').textContent = `Draw starting soon...`;
                        document.getElementById('status-am').textContent = `ዕጣው በቅርቡ ይጀምራል...`;
                    }
                }
            } catch (e) {
                console.error('Error updating countdown:', e);
            }
        }
        
        updateCountdown();
        countdownInterval = setInterval(updateCountdown, 1000);
    </script>
</body>
</html>
