services:
  type: static_site
  name: siket-lottery-tma
  env: static
  buildCommand: ""
  publishDir: public
  headers:
    - path: /*
      name: X-Content-Type-Options
      value: nosniff
    - path: /*
      name: X-Frame-Options
      value: DENY
    - path: /*
      name: X-XSS-Protection
      value: "1; mode=block"
  routes:
    - type: rewrite
      source: /*
      destination: /index.html
